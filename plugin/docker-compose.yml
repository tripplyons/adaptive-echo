version: '3.8'

services:
  plugin:
    platform: linux/amd64
    build: .
    container_name: adaptive-echo
    ports:
      - "6080:6080"
    stdin_open: true
    tty: true
    restart: "no"
    volumes:
      - builder-build:/app/build
    environment:
      - DISPLAY=:99

volumes:
  builder-build: