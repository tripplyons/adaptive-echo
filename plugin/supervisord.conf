[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
[program:xvfb]
command=/bin/bash -lc "Xvfb :99 -screen 0 1024x768x16"
autostart=true
autorestart=true
priority=10

[program:xfce]
command=/bin/bash -lc "sleep 3 && export DISPLAY=:99 && export PULSE_SERVER=unix:/var/run/pulse/native && dbus-run-session -- startxfce4"
autostart=true
autorestart=true
priority=20
environment=DISPLAY=:99,PULSE_SERVER=unix:/var/run/pulse/native,HOME=/tmp

[program:x11vnc]
command=/bin/bash -lc "x11vnc -display :99 -rfbport 5900 -forever -nopw -shared"
autostart=true
autorestart=true
priority=30

[program:novnc]
command=/bin/bash -lc "sleep 2 && websockify --web=/opt/novnc 0.0.0.0:6080 localhost:5900"
autostart=true
autorestart=true
priority=40

[program:xterm]
command=/bin/bash -lc "xfce4-terminal --working-directory=/app"
autostart=true
autorestart=true
priority=50