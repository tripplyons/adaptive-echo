[project]
name = "adaptive-echo-jax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tripp Lyons", email = "tripplyons@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.13",
    "jaxlib>=0.4.30",
    "soundfile>=0.13.1",
]

[project.scripts]
adaptive-echo-jax = "adaptive_echo_jax:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
